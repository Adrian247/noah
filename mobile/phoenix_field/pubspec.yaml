name: phoenix_field
description: Phoenix — app de campo offline-first (rutinas, sync, formularios dinámicos).
publish_to: 'none'
version: 0.7.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.8.0+1
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  intl: ^0.20.2
  file_picker: ^8.1.7
  signature: ^5.5.0
  image_picker: ^1.1.2
  workmanager: ^0.9.0
  local_auth: ^2.3.0
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.6.1
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.1
  build_runner: ^2.5.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/phoenix_logo.png
    - assets/images/app_icon.png
    - assets/images/app_icon_foreground.png
