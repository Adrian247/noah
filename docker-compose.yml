services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["sh", "/var/www/html/docker/entrypoint.sh"]
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_NAME: Phoenix
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8888
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: phoenix
      DB_USERNAME: phoenix
      DB_PASSWORD: phoenix
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_MAILER: smtp
      PHOENIX_DEMO_PASSWORD: phoenix_application
      PHOENIX_REPORTS_PDF_DRIVER: auto
      PHOENIX_REPORTS_CHROME_PATH: /usr/bin/chromium
      PHOENIX_REPORTS_CHROME_NO_SANDBOX: "true"

  web:
    image: nginx:1.27-alpine
    ports:
      - "8888:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phoenix
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: phoenix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix -d phoenix"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: phoenix
      MINIO_ROOT_PASSWORD: phoenixsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --sleep=1 --tries=3
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
      - postgres
    environment:
      APP_NAME: Phoenix
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8888
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: phoenix
      DB_USERNAME: phoenix
      DB_PASSWORD: phoenix
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_MAILER: smtp

volumes:
  postgres_data:
  minio_data:
